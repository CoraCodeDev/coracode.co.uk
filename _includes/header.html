<header>
    <nav>
        <a href="/" class="logo">
            <img src="/assets/logo.svg" alt="{{ site.title }}" width="160" height="40">
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul>
            {% assign nav_items = "Home,Projects,Skills,About,Contact" | split: "," %}
            {% for item in nav_items %}
            {% assign slug = item | downcase %}
            {% assign url = "/" %}
            {% if slug != "home" %}
                {% assign url = slug | append: ".html" %}
            {% endif %}
            <li><a href="{{ url }}"{% if page.url == url or (slug == "home" and page.url == "/") %} class="active"{% endif %}>{{ item }}</a></li>
            {% endfor %}
        </ul>
    </nav>
    <script>
        document.querySelector('.nav-toggle')?.addEventListener('click', function() {
            const expanded = this.getAttribute('aria-expanded') === 'true';
            this.setAttribute('aria-expanded', !expanded);
            document.querySelector('nav ul').classList.toggle('open');
        });
    </script>
</header>
