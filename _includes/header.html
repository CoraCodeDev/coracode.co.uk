<header>
    <nav>
        <a href="/" class="logo">{{ site.title }}</a>
        <ul>
            {% assign nav_items = "Home,Projects,Skills,Contact" | split: "," %}
            {% for item in nav_items %}
            {% assign slug = item | downcase %}
            {% assign url = "/" %}
            {% if slug != "home" %}
                {% assign url = slug | append: ".html" %}
            {% endif %}
            <li><a href="{{ url }}"{% if page.url == url or (slug == "home" and page.url == "/") %} class="active"{% endif %}>{{ item }}</a></li>
            {% endfor %}
        </ul>
    </nav>
</header>
